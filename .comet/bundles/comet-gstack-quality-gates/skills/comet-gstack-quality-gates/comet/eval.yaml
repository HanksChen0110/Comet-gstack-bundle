apiVersion: comet.eval/v1alpha1
kind: SkillEvalManifest
metadata:
  name: comet-gstack-quality-gates
  description: Current-spec approval and bounded quality-gate checks
  draftHash: <current-bundle-hash>
skill:
  name: comet-gstack-quality-gates
  source: ..
  profile: authoring-skill
evaluation:
  recommendedTasks:
    - workflow-overlay-contract
    - workflow-route-conformance
  baselineTreatments:
    - CONTROL
    - COMET_FULL_040_BETA
  qualityGates:
    minWeightedScore: 0.8
    minPassAt1: 0.6
    maxInstabilityGap: 0.4
  requiredOutputSchemas:
    - comet.intake.v1
    - comet.design.v1
    - comet.plan.v1
    - comet.execution-evidence.v1
    - comet.handoff.v1
    - comet.review.v1
    - gstack.review.current-diff.v1
    - comet.verify.v1
    - gstack.verify.scoped.v1
    - comet.archive.v1
