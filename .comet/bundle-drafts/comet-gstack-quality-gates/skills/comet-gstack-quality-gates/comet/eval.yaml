      artifacts:
        - openspec/changes/eval-negative/evidence/gstack/verify-ordered-gates.json
      expectedFailures: &a1
        - verification-before-qa
      setupNode: verify
      operations:
        - kind: receipt
          node: verify
          skill: verification-gate
          expect: passed
          schemaEvidence:
            verification-commands:
              - "negative-eval: workflow-guard receipt"
            verification-result: pass
            verification-gate-run-id: negative-eval-vg-reversed
            verification-gate-passed: true
            verification-completed-at: 2030-01-01T00:00:10.000Z
            verification-gate-completed-at: 2030-01-01T00:00:10.000Z
            verification-gate-code-state-hash: <current-code-state-hash>
            verification-gate-draft-hash: <current-draft-hash>
        - kind: receipt
          node: verify
          skill: qa
          expect: passed
          schemaEvidence:
            qa-run-id: negative-eval-qa-reversed
            qa-completed-at: 2030-01-01T00:00:05.000Z
            qa-code-modified: false
            qa-new-commit-created: false
            qa-fix-required: false
            qa-code-state-after-hash: <current-code-state-hash>
            qa-draft-hash: <current-draft-hash>
        - kind: materialize-artifacts
          expect: passed
        - kind: exit
          node: verify
          expect: blocked
          expectedFailures: *a1
    - id: qa-modified-code-then-archive
      node: archive
      expect: blocked
      description: QA 修改代码后仍尝试进入 archive。
      evidenceByNode:
        verify:
          completedChecks:
            - required-skill:verify.verification-gate
            - required-skill:verify.qa
          schemaEvidence:
            verification-gate-passed: true
            qa-code-modified: true
            qa-new-commit-created: false
