            verification-result: pass
            verification-gate-run-id: negative-eval-vg-before-qa-mutation
            verification-gate-passed: true
            verification-gate-completed-at: <current-time>
            verification-gate-code-state-hash: <current-code-state-hash>
            verification-gate-draft-hash: <current-draft-hash>
        - kind: mutate-code
