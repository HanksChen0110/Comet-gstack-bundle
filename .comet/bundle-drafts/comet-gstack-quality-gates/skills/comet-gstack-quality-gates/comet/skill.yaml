apiVersion: comet/v1alpha1
kind: Skill
metadata:
  name: comet-gstack-quality-gates
  version: 1.1.0
  description: Confirm the current OpenSpec version and budget before bounded Comet Classic development.
goal:
  statement: 保留 Comet Classic 状态机，在当前规格确认后限额实现、完整 diff 一次审查、按场景验证与当前证据归档。
  inputs: []
  outputs:
    - name: result
      description: Current workflow result and evidence
  success:
    - The current approved specification and project rules match all execution evidenceorchestration:
  mode: deterministic
  entry: node-1-open
  steps:
    - id: node-1-open
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-open
      next: node-2-design
    - id: node-2-design
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-design
      next: node-3-plan
    - id: node-3-plan
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-plan
      next: node-4-execute
    - id: node-4-execute
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-execute
      next: node-5-subagent-execute
    - id: node-5-subagent-execute
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-subagent-execute
      next: node-6-review
    - id: node-6-review
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-review
      next: node-7-verify
    - id: node-7-verify
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-verify
      next: node-8-archive
    - id: node-8-archive
      action:
        type: invoke_skill
        ref: comet-gstack-quality-gates-archive
skills:
  - id: comet-gstack-quality-gates-open
  - id: comet-gstack-quality-gates-design
  - id: comet-gstack-quality-gates-plan
  - id: comet-gstack-quality-gates-execute
  - id: comet-gstack-quality-gates-subagent-execute
  - id: comet-gstack-quality-gates-review
  - id: comet-gstack-quality-gates-verify
  - id: comet-gstack-quality-gates-archive
agents: []
tools: []
